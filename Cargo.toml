[package]
name = "incinerate"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
burn = { version = "~0.21", features = ["std", "tui", "train", "vision", "wgpu", "fusion"], default-features = false }
clap = { version = "4.6.6", features = ["derive"] }
maud = { version = "0.27.0", features = ["axum"] }
ndarray = "0.17.2"
png = "0.18.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
wgpu = "30.0.0"

[[bin]]
name = "ndarray_scratch"
path = "src/ndarray_scratch/main.rs"


[[bin]]
name = "gpu_scratch"
path = "src/gpu_scratch/main.rs"

[[bin]]
name = "server"
path = "src/server/main.rs"
